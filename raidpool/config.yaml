name: RAIDPool
version: "0.13.2"
slug: raidpool
description: >-
  NAS mit Festplatten-Pool wie StableBit DrivePool (Duplizierung pro Ordner),
  Übernahme bestehender DrivePool-Platten, SMART-Überwachung und Weboberfläche.
url: https://github.com/IngoPodolak/raidpool
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:nas
panel_title: RAIDPool
# Zugriff auf Festplatten, FUSE (mergerfs/ntfs-3g) und Mounts
full_access: true
apparmor: false
# SMB-Freigaben (Port 445) und Sichtbarkeit in der Windows-Netzwerkumgebung
host_network: true
udev: true
kernel_modules: true
devices:
  - /dev/fuse
privileged:
  - SYS_ADMIN
  - SYS_RAWIO
  - SYS_MODULE
  - DAC_READ_SEARCH
  - NET_ADMIN
  - NET_RAW
homeassistant_api: true
# Integration in HA über MQTT-Discovery (Mosquitto-Broker wird automatisch gefunden)
services:
  - mqtt:want
hassio_api: true
hassio_role: manager
# Cache auf der System-SSD und der (neu aufbaubare) Datei-Index gehören nicht in HA-Backups
backup_exclude:
  - "cache"
  - "cache/**"
  - "index.db*"
map:
  - addon_config:rw
  - share:rw
  - media:rw
options:
  read_only: true
  auto_mount_ntfs: true
  power_default: always
  spindown_minutes: 60
  smart_interval_minutes: 30
  smart_wake_disks: false
  publish_sensors: true
  sensor_interval_seconds: 60
  log_level: info
schema:
  read_only: bool
  auto_mount_ntfs: bool
  power_default: list(always|vendor|spindown)
  spindown_minutes: int(10,330)
  smart_interval_minutes: int(5,1440)
  smart_wake_disks: bool
  publish_sensors: bool
  sensor_interval_seconds: int(15,3600)
  log_level: list(debug|info|warning|error)
